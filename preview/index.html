<html lang="en">
<head>

<meta name="theme-color" content="#1B1713" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Codex Club">
<title>The Codex Club</title>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;1,7..72,400&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F3ECDD; --paper-2:#EBE2CE; --paper-3:#E2D6BC; --edge:#D8CBAE;
  --ink:#2A221C; --ink-2:#5E5145; --ink-3:#8A7B6B;
  --accent:#8E3B2E; --accent-ink:#FBF6EC; --gilt:#B08A3E; --wood:#7A5638; --wood-2:#5E412A;
  --shadow:0 1px 2px rgba(60,40,20,.12),0 6px 18px rgba(60,40,20,.12);
  --display:"Cormorant Garamond",Georgia,"Times New Roman",serif;
  --text:"Literata",Georgia,"Times New Roman",serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root{
    --paper:#1B1713; --paper-2:#241F19; --paper-3:#2E2720; --edge:#3A3128;
    --ink:#EDE3D1; --ink-2:#C2B49E; --ink-3:#8F8270;
    --accent:#D2876F; --accent-ink:#1B1713; --gilt:#D3AE62; --wood:#4A3424; --wood-2:#33241A;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 22px rgba(0,0,0,.35);
    color-scheme:dark;
  }
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  background:var(--paper);
  background-image:radial-gradient(ellipse at 20% 0%,rgba(255,255,255,.35),transparent 60%),radial-gradient(ellipse at 100% 100%,rgba(120,90,50,.08),transparent 55%);
  color:var(--ink);font-family:var(--text);font-size:16px;line-height:1.55;
  -webkit-font-smoothing:antialiased;min-height:100vh;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--accent)}
.page{max-width:920px;margin:0 auto;padding:20px 16px 120px}
h1,h2,h3{font-family:var(--display);font-weight:600;line-height:1.1;margin:0}
.sc{font-variant:small-caps;letter-spacing:.08em;text-transform:lowercase}
.muted{color:var(--ink-2)}.faint{color:var(--ink-3)}
.fleuron{display:flex;align-items:center;gap:12px;color:var(--gilt);margin:18px 0}
.fleuron::before,.fleuron::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,transparent,var(--gilt),transparent)}
.btn{border:1px solid var(--edge);background:var(--paper-2);border-radius:8px;padding:10px 16px;font-size:15px}
.btn:hover{border-color:var(--ink-3)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.ghost{background:transparent}
.btn:disabled{opacity:.5;cursor:default}
.field{display:flex;flex-direction:column;gap:5px;font-size:14px;color:var(--ink-2)}
.field input,.field select,.field textarea{font-size:16px;color:var(--ink);background:var(--paper);border:1px solid var(--edge);border-radius:8px;padding:10px 12px;width:100%;min-width:0}
.field textarea{resize:vertical;min-height:90px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.status{font-size:14px;color:var(--ink-2);min-height:1.4em}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* title page */
.titlepage{text-align:center;padding:22px 0 6px}
.titlepage .kicker{font-family:var(--display);font-size:15px;color:var(--gilt);letter-spacing:.3em;text-transform:uppercase}
.titlepage h1{font-size:46px;margin-top:6px}
.titlepage p{margin:6px 0 0;color:var(--ink-2);font-style:italic}

/* bookshelf of profiles */
.case{margin-top:26px;padding:0 6px}
.spines{display:flex;align-items:flex-end;gap:8px;padding:0 10px;min-height:250px;overflow-x:auto;scrollbar-width:none}
.spines::-webkit-scrollbar{display:none}
.spine{flex:0 0 auto;width:64px;border:0;border-radius:4px 4px 2px 2px;position:relative;color:#F4E9D2;
  background:var(--c,#7A2E2A);
  background-image:linear-gradient(90deg,rgba(0,0,0,.28),rgba(255,255,255,.10) 18%,rgba(255,255,255,0) 40%,rgba(0,0,0,.18) 85%,rgba(0,0,0,.35));
  box-shadow:inset 0 0 0 1px rgba(0,0,0,.15),2px 0 4px rgba(0,0,0,.18);
  display:flex;flex-direction:column;align-items:center;padding:14px 0;transition:transform .2s ease}
.spine:hover{transform:translateY(-6px)}
.spine .band{width:100%;height:5px;border-top:1px solid rgba(225,190,110,.75);border-bottom:1px solid rgba(225,190,110,.75);margin:4px 0}
.spine .name{writing-mode:vertical-rl;transform:rotate(180deg);font-family:var(--display);font-weight:700;font-size:22px;letter-spacing:.06em;margin:12px 0;flex:1;display:flex;align-items:center;color:#F1D99A;text-shadow:0 1px 0 rgba(0,0,0,.35)}
.spine .num{font-family:var(--display);font-size:13px;color:#EAD7A8}
.spine.add{background:transparent;background-image:none;border:2px dashed var(--ink-3);color:var(--ink-2);box-shadow:none;justify-content:center}
.spine.add .name{color:var(--ink-2);text-shadow:none;font-size:18px}
.plank{height:16px;margin:0 0 0;border-radius:3px;background:linear-gradient(var(--wood),var(--wood-2));box-shadow:0 8px 14px -6px rgba(60,40,20,.5)}
.casehint{text-align:center;font-size:14px;color:var(--ink-3);margin-top:12px;font-style:italic}

.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px;margin-top:28px}
.card{border:1px solid var(--edge);background:var(--paper-2);border-radius:10px;padding:18px;display:flex;flex-direction:column;gap:8px;text-align:left}
.card h2{font-size:26px}
button.card:hover{border-color:var(--ink-3)}
.badge{display:inline-block;min-width:22px;padding:0 7px;border-radius:11px;background:var(--accent);color:var(--accent-ink);font-size:13px;text-align:center;font-family:var(--text);font-weight:600;vertical-align:3px}
.foot{margin-top:28px;font-size:14px;color:var(--ink-3);text-align:center}
.foot button{background:none;border:0;color:var(--accent);text-decoration:underline;padding:4px}

/* profile page */
.topbar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
.back{background:none;border:0;color:var(--ink-2);font-family:var(--display);font-size:19px;padding:6px 0}
.ribbon{width:16px;height:40px;background:var(--c);clip-path:polygon(0 0,100% 0,100% 100%,50% 78%,0 100%);margin-right:4px}
.phead{text-align:center;padding:4px 0 0}
.phead h1{font-size:42px}
.phead .stats{margin-top:6px;color:var(--ink-2)}
.rename{margin-top:8px;border:1px solid var(--edge);background:transparent;border-radius:16px;padding:4px 12px;font-size:13px;color:var(--ink-2)}
.tabs{display:flex;gap:4px;justify-content:center;margin:18px 0 14px;flex-wrap:wrap}
.tab{border:0;background:none;padding:8px 12px;font-family:var(--display);font-size:18px;color:var(--ink-3);border-bottom:2px solid transparent}
.tab[aria-selected="true"]{color:var(--ink);border-color:var(--c,var(--accent))}
.tools{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.tools input[type=search]{flex:1 1 200px;font-size:16px;background:var(--paper);border:1px solid var(--edge);border-radius:20px;padding:9px 16px;min-width:0}
.tools select{background:var(--paper);border:1px solid var(--edge);border-radius:20px;padding:8px 12px;font-size:15px}
.chips{display:flex;gap:6px;overflow-x:auto;margin:12px -16px 0;padding:0 16px 4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;border:1px solid var(--edge);background:var(--paper);border-radius:16px;padding:5px 12px;font-size:14px;color:var(--ink-2)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.section{margin-top:26px}
.section h2{font-size:24px;display:flex;align-items:baseline;gap:10px;margin-bottom:12px}
.section h2 small{font-family:var(--text);font-size:13px;color:var(--ink-3);font-weight:400}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:18px 14px}
.book{border:0;background:none;padding:0;text-align:left;display:flex;flex-direction:column;gap:6px;min-width:0}
.cover{position:relative;aspect-ratio:2/3;border-radius:2px 4px 4px 2px;overflow:hidden;background:var(--paper-3);box-shadow:var(--shadow)}
.cover::after{content:"";position:absolute;inset:0 auto 0 0;width:7px;background:linear-gradient(90deg,rgba(0,0,0,.28),rgba(255,255,255,.12),transparent)}
.cover img{width:100%;height:100%;object-fit:cover;display:block}
.cloth{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:space-between;padding:12px 10px 10px 14px;color:#F1E3C4;background:var(--cc,#3D4A3A);
  background-image:repeating-linear-gradient(45deg,rgba(255,255,255,.035) 0 2px,transparent 2px 4px)}
.cloth b{font-family:var(--display);font-weight:700;font-size:16px;line-height:1.1;color:#F1D99A}
.cloth i{font-size:11px;font-style:normal;opacity:.85}
.cloth::before{content:"";position:absolute;inset:6px 6px 6px 10px;border:1px solid rgba(225,190,110,.5);pointer-events:none}
.book .t{font-size:14px;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.book .a{font-size:12px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill{position:absolute;top:6px;right:6px;z-index:1;font-size:10px;letter-spacing:.06em;text-transform:uppercase;background:var(--paper);color:var(--ink);border-radius:3px;padding:1px 5px;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.empty{border:1px dashed var(--edge);border-radius:10px;padding:28px 18px;text-align:center;color:var(--ink-2);font-style:italic}
.fab{position:fixed;right:max(18px,env(safe-area-inset-right));bottom:calc(22px + env(safe-area-inset-bottom));z-index:20;border:0;background:var(--accent);color:var(--accent-ink);border-radius:28px;padding:14px 20px;font-weight:600;box-shadow:0 8px 20px rgba(90,40,20,.35);display:flex;align-items:center;gap:8px}
.fab span{font-size:22px;line-height:1}

/* sheets */
.scrim{position:fixed;inset:0;background:rgba(30,20,12,.45);z-index:40;display:flex;align-items:flex-end;justify-content:center;animation:fade .2s ease}
.sheet{background:var(--paper);width:100%;max-width:640px;max-height:92vh;overflow:auto;border-radius:16px 16px 0 0;padding:10px 18px calc(24px + env(safe-area-inset-bottom));box-shadow:0 -10px 30px rgba(0,0,0,.25);animation:rise .25s ease}
@media (min-width:700px){.scrim{align-items:center}.sheet{border-radius:14px}}
.grab{width:42px;height:5px;border-radius:3px;background:var(--edge);margin:4px auto 14px}
.grabzone{padding:6px 0 2px;margin:-10px -18px 0;touch-action:none}
.sheet{position:relative;overscroll-behavior:contain}
.sheetx{position:sticky;top:0;float:right;z-index:2;width:38px;height:38px;margin:2px -6px 0 0;border-radius:50%;border:1px solid var(--edge);background:var(--paper-2);color:var(--ink);font-size:16px;line-height:1}
.sheet h2{font-size:30px}
.detail{display:grid;grid-template-columns:110px 1fr;gap:16px;align-items:start}
.detail .meta{font-size:14px;color:var(--ink-2)}
.seg{display:flex;border:1px solid var(--edge);border-radius:10px;overflow:hidden;margin:16px 0}
.seg button{flex:1;border:0;background:var(--paper-2);padding:10px 4px;font-size:14px;color:var(--ink-2)}
.seg button+button{border-left:1px solid var(--edge)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper);font-weight:600}
.plot{margin:12px 0 0;max-width:62ch}
.plot::first-letter{font-family:var(--display);font-size:2.6em;float:left;line-height:.8;padding:6px 6px 0 0;color:var(--accent)}
.margin{margin-top:18px;padding:14px;border-left:3px solid var(--gilt);background:var(--paper-2);border-radius:0 8px 8px 0}
.margin .field textarea{background:transparent;border-style:dashed;font-style:italic}
.results{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.result{display:flex;gap:10px;align-items:center;border:1px solid var(--edge);background:var(--paper-2);border-radius:8px;padding:6px;text-align:left}
.result img,.result .noimg{width:38px;height:56px;object-fit:cover;border-radius:2px;background:var(--paper-3);flex:0 0 38px}
.result div{min-width:0}.result b{display:block;font-weight:600;font-size:15px}.result small{color:var(--ink-3)}
.cropwrap{display:flex;flex-direction:column;gap:10px;padding:12px;border:1px solid var(--edge);border-radius:10px;background:var(--paper-2)}
.cropstage{position:relative;touch-action:none;user-select:none;line-height:0;align-self:center;max-width:100%}
.cropimg{display:block;max-width:100%;max-height:52vh;width:auto;height:auto}
.cropframe{position:absolute;border:2px solid #fff;box-shadow:0 0 0 9999px rgba(0,0,0,.5),inset 0 0 0 1px rgba(0,0,0,.4);cursor:move;touch-action:none}
.cropstage{overflow:hidden;border-radius:6px}
.camera{position:fixed;inset:0;z-index:90;background:#000;display:flex;align-items:center;justify-content:center}
.camvideo{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.camguide{position:relative;width:min(62vw,46vh);aspect-ratio:2/3;border:3px solid rgba(255,255,255,.9);border-radius:6px;box-shadow:0 0 0 9999px rgba(0,0,0,.45)}
.camguide.bar{aspect-ratio:2/1;width:min(80vw,420px)}
.camhint{position:absolute;top:calc(env(safe-area-inset-top) + 24px);left:16px;right:16px;text-align:center;color:#fff;font-size:16px;text-shadow:0 1px 3px #000}
.cambar{position:absolute;left:0;right:0;bottom:calc(env(safe-area-inset-bottom) + 24px);display:flex;justify-content:space-around;align-items:center}
.camshutter{width:72px;height:72px;border-radius:50%;border:5px solid #fff;background:rgba(255,255,255,.35)}
.camshutter:active{background:#fff}
.swatches{display:flex;gap:10px;flex-wrap:wrap}
.swatch{width:40px;height:56px;border-radius:3px;border:0;background:var(--c);box-shadow:inset 0 0 0 1px rgba(0,0,0,.2)}
.swatch[aria-pressed="true"]{outline:3px solid var(--ink);outline-offset:2px}
.letter{border:1px solid var(--edge);background:var(--paper-2);border-radius:8px;padding:14px 16px;display:flex;flex-direction:column;gap:6px}
.letter .t{font-family:var(--display);font-size:21px;font-weight:600}
.letter p{margin:0;font-style:italic}
.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

/* page turn */
.turn{position:fixed;inset:0;z-index:30;perspective:1800px;pointer-events:none}
.turn .leaf{position:absolute;inset:0;transform-origin:left center;backface-visibility:hidden;background:var(--c);
  background-image:linear-gradient(90deg,rgba(0,0,0,.35),rgba(0,0,0,0) 6%,rgba(255,255,255,.06) 50%,rgba(0,0,0,.25));
  display:flex;flex-direction:column;align-items:center;justify-content:center;color:#F1D99A;font-family:var(--display)}
.turn .leaf::before{content:"";position:absolute;inset:18px 18px 18px 26px;border:2px solid rgba(225,190,110,.6)}
.turn .leaf::after{content:"";position:absolute;inset:26px 26px 26px 34px;border:1px solid rgba(225,190,110,.4)}
.turn .leaf .k{letter-spacing:.35em;font-size:15px;text-transform:uppercase}
.turn .leaf .n{font-size:54px;font-weight:700;margin-top:10px;text-align:center;padding:0 40px}
.turn .leaf .o{font-size:22px;margin-top:14px}
.turn.paper .leaf{background:var(--paper);color:var(--ink)}
.turn.paper .leaf::before,.turn.paper .leaf::after{border-color:var(--edge)}
@keyframes fade{from{opacity:0}}
@keyframes rise{from{transform:translateY(30px);opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.ptr{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 8px);z-index:70;transform:translate(-50%,-70px);width:44px;height:44px;border-radius:50%;background:var(--paper);box-shadow:var(--shadow);border:1px solid var(--edge);display:flex;align-items:center;justify-content:center;color:var(--accent);font-size:22px;pointer-events:none}
.ptr.spin span{animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
body{overscroll-behavior-y:contain}
#pvbar{position:sticky;top:0;z-index:50;background:#A8742B;color:#fff;font-size:13px;text-align:center;padding:6px 12px}
.stars{display:flex;gap:2px}.stars button{border:0;background:none;font-size:28px;line-height:1;padding:2px;color:var(--edge)}
.stars button[aria-pressed="true"]{color:var(--gilt)}
.stars-ro{color:var(--gilt);letter-spacing:1px}.stars-ro .off{color:var(--edge)}.stars-ro.sm{font-size:12px}
.brow{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:10px 0}
.pagebox{margin:6px 0 4px}.pagein{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.pagein input{width:84px;font-size:16px;background:var(--paper);border:1px solid var(--edge);border-radius:8px;padding:6px 8px}
.bigprog{height:8px;border-radius:4px;background:var(--paper-3);overflow:hidden}.bigprog i{display:block;height:100%;background:var(--accent);border-radius:4px}
.prog{position:absolute;left:0;right:0;bottom:0;height:5px;background:rgba(0,0,0,.35);z-index:1}.prog i{display:block;height:100%;background:var(--gilt)}
.pill.lent{left:6px;right:auto;background:var(--accent);color:var(--accent-ink)}
.dates{margin:6px 0 4px}
.also{margin:12px 0 0;font-size:14px;color:var(--ink-2);background:var(--paper-2);border-radius:8px;padding:8px 12px}
.fold{margin-top:14px;border-top:1px solid var(--edge);padding-top:10px}
.fold summary{cursor:pointer;font-family:var(--display);font-size:19px;font-weight:600}
.fold textarea,.fold input{width:100%;font-size:16px;background:var(--paper);border:1px solid var(--edge);border-radius:8px;padding:8px 10px;margin:8px 0}
.quotes blockquote{margin:10px 0;padding:6px 30px 6px 12px;border-left:3px solid var(--gilt);font-style:italic;position:relative}
.qx{position:absolute;right:0;top:4px;border:0;background:none;color:var(--ink-3)}
.follows{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}
.statgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media (min-width:640px){.statgrid{grid-template-columns:repeat(4,1fr)}}
.stat{border:1px solid var(--edge);background:var(--paper-2);border-radius:10px;padding:14px;text-align:center}
.stat b{display:block;font-family:var(--display);font-size:34px;line-height:1}.stat span{font-size:13px;color:var(--ink-3)}
.yearnav{display:flex;align-items:center;justify-content:center;gap:18px}.yearnav .back{font-size:30px}.yearnav .back:disabled{opacity:.25}
.months{display:grid;grid-template-columns:repeat(12,1fr);gap:4px;height:140px;align-items:end}
.mcol{display:flex;flex-direction:column;align-items:center;height:100%;justify-content:flex-end;gap:4px}
.mbar{width:100%;min-height:2px;background:var(--c,var(--accent));border-radius:3px 3px 0 0;position:relative}
.mbar span{position:absolute;top:-18px;left:0;right:0;text-align:center;font-size:11px;color:var(--ink-2)}
.mcol small{font-size:11px;color:var(--ink-3)}
.hbars{display:flex;flex-direction:column;gap:8px}.hbar{display:grid;grid-template-columns:minmax(90px,38%) 1fr;gap:10px;align-items:center;font-size:14px}
.hbar span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.hbar b{background:var(--c,var(--accent));color:#fff;border-radius:4px;padding:2px 8px;font-size:12px;text-align:right;min-width:24px}
.book.fav{flex-direction:row;gap:16px;align-items:center}.book.fav .cover{width:110px;flex:0 0 110px}
.newsrow{display:grid;grid-template-columns:76px 1fr;gap:12px;align-items:start}
.soon{color:var(--accent);font-weight:600;font-size:14px}
.room{position:relative;max-width:460px;margin:0 auto;overflow:hidden;border-radius:14px;box-shadow:var(--shadow);background:#1E120A;aspect-ratio:400/700;touch-action:pan-y}

  const go2 = async e => {

    msg.textContent = "Binding your volume";
    try {
      const uid = DB.mode === "firebase" ? meUid() : (slug(n) + (profiles[slug(n)] ? "-" + Date.now().toString(36) : ""));
      const p = { name: n, color, created: Date.now() };
      let seed = null;
      if (fileIn.files[0]) { const d = JSON.parse(await fileIn.files[0].text()); seed = d.books && !d.profiles ? (src.value === "phone-gaia" ? d.gaia_books : d.books) : null; if (d.profiles) { const k = Object.keys(d.profiles)[0]; seed = d.books?.[k]; } }
      else if (src.value === "seed") { const d = await fetch("data.json").then(r => r.json()); seed = d.books; p.seedFrom = "data.json"; p.seen = Object.keys(d.books); }
      else if (src.value === "phone-jacopo") { seed = legacy.books; p.seedFrom = "data.json"; p.seen = Object.keys(legacy.books || {}); }
      else if (src.value === "phone-gaia") seed = legacy.gaia_books;
      else if (src.value.startsWith("v2-")) { const k = src.value.slice(3); seed = v2.books[k]; if (v2.profiles[k].seedFrom) { p.seedFrom = v2.profiles[k].seedFrom; p.seen = v2.profiles[k].seen || []; } if (!name.value.trim()) name.value = v2.profiles[k].name; }
      ui.creating = true; submit.disabled = true;
      p.handle = await freeHandle(n); p.private = false;
      await DB.saveProfile(uid, p);
      profiles[uid] = { ...(profiles[uid] || {}), ...p };
      const inv = sessionStorage.getItem("cc-invite"); if (inv && DB.mode === "firebase") { await DB.useInvite(inv, uid).catch(() => {}); sessionStorage.removeItem("cc-invite"); }
      if (seed && Object.keys(seed).length) { msg.textContent = "Shelving " + Object.keys(seed).length + " books"; await DB.setBooks(uid, seed); }
      if (DB.mode === "local") DB.use(uid);
      ui.creating = false; $app.dataset.view = ""; toast("Your shelf is ready");
      if (location.hash.slice(1) === "/" || !location.hash) render(); else location.hash = "/";
      window.scrollTo(0, 0);
    } catch (err) {
      ui.creating = false; submit.disabled = false;
      const t = err.code === "permission-denied" ? "Firebase refused the save. Check that the Firestore rules are published." : "Something went wrong: " + (err.code || err.message);
      msg.textContent = t; toast(t);
    }
  };
  mount(
    first ? null : h("div", { class: "topbar" }, h("button", { class: "back", onclick: () => go("/") }, "‹ Library")),
    h("header", { class: "titlepage" }, h("div", { class: "kicker" }, "Ex Libris"), h("h1", {}, first ? "Your volume" : "A new reader"), h("p", {}, "Pick a name and a binding for the shelf")),
    h("div", { class: "fleuron" }, "❦"),
    h("form", { class: "auth", onsubmit: go2 },
      h("label", { class: "field" }, "Name on the spine", name),
      h("div", { class: "field" }, "Binding", sw),
      h("label", { class: "field" }, "Books to start with", src),
      h("label", { class: "field" }, "Or load a backup file", fileIn),
      submit, msg,
      DB.mode === "firebase" ? h("button", { class: "btn ghost", type: "button", onclick: () => DB.signOut() }, "Sign out") : null)
  );
  setTimeout(() => name.focus(), 50);
}

function renderAuth() {
  ui.route = "auth"; $app.dataset.view = "auth";
  let mode = "in";
  const email = h("input", { type: "email", autocomplete: "email", required: true }), pass = h("input", { type: "password", autocomplete: "current-password", required: true, minlength: 6 }), msg = h("div", { class: "status", role: "status" });
  const btn = h("button", { class: "btn primary", type: "submit" }, "Sign in"), swap = h("button", { class: "btn ghost", type: "button" }, "New here? Create an account");
  swap.onclick = () => { mode = mode === "in" ? "up" : "in"; codeRow.hidden = !(mode === "up" && INVITE_ONLY); btn.textContent = mode === "in" ? "Sign in" : "Create account"; swap.textContent = mode === "in" ? "New here? Create an account" : "I already have an account"; pass.autocomplete = mode === "in" ? "current-password" : "new-password"; msg.textContent = ""; };
  const errs = { "auth/invalid-credential": "Wrong email or password.", "auth/email-already-in-use": "That email already has an account, sign in instead.", "auth/weak-password": "Use at least 6 characters.", "auth/invalid-email": "That email does not look right.", "auth/network-request-failed": "No internet connection." };
  const code = h("input", { autocomplete: "off", placeholder: "e.g. BOOK-7Q2K", value: new URLSearchParams(location.search).get("invite") || sessionStorage.getItem("cc-invite") || "" });
  const codeRow = h("label", { class: "field", hidden: true }, "Invite code", code);
  const submit = async e => { e.preventDefault(); btn.disabled = true; msg.textContent = mode === "in" ? "Signing in" : "Creating your account";
    try {
      if (mode === "up" && INVITE_ONLY) { const c = code.value.trim().toUpperCase(), inv = c && await DB.getInvite(c).catch(() => null); if (!inv || inv.usedBy) { msg.textContent = "The Codex Club is invite only. Ask a member for a code."; btn.disabled = false; return; } sessionStorage.setItem("cc-invite", c); }
      await (mode === "in" ? DB.signIn : DB.signUp)(email.value.trim(), pass.value);
    } catch (err) { msg.textContent = errs[err.code] || "Could not sign in: " + err.code; } btn.disabled = false; };
  mount(
    h("header", { class: "titlepage" }, h("div", { class: "kicker" }, "Ex Libris"), h("h1", {}, "The Codex Club"), h("p", {}, "Sign in to open your shelf")),
    h("div", { class: "fleuron" }, "❦"),
    h("form", { class: "auth", onsubmit: submit }, h("label", { class: "field" }, "Email", email), h("label", { class: "field" }, "Password", pass), codeRow, btn, swap, msg,
      h("button", { class: "btn ghost", type: "button", onclick: async () => { if (!email.value) { msg.textContent = "Type your email first."; return; } try { await DB.reset(email.value.trim()); msg.textContent = "Check your inbox for a reset link."; } catch (err) { msg.textContent = errs[err.code] || err.code; } } }, "Forgot password"))
  );
}

/* ---------- backup (local mode) ---------- */
async function exportBackup() {
  const name = "exlibris-backup-" + today() + ".json", blob = new Blob([JSON.stringify(DB.exportAll())], { type: "application/json" }), file = new File([blob], name, { type: "application/json" });
  if (navigator.canShare?.({ files: [file] })) { try { await navigator.share({ files: [file], title: name }); return; } catch (e) { if (e.name === "AbortError") return; } }
  const a = h("a", { href: URL.createObjectURL(blob), download: name }); a.click(); toast("Backup saved");
}
async function importBackup(e) {
  const f = e.target.files[0]; if (!f) return;
  try { const d = JSON.parse(await f.text()); if (!d.profiles) throw 0; if (!confirm("Replace the library on this phone with this backup?")) return; await DB.importAll(d); toast("Backup loaded"); } catch (err) { toast("That file is not a library backup"); }
  e.target.value = "";
}

/* ---------- boot ---------- */
function go(path) { if (location.hash.slice(1) === path) render(); else location.hash = path; }
window.addEventListener("hashchange", render);
(async () => {
  try { DB = PREVIEW ? localAdapter("exlibris-preview-sandbox-5", true) : FIREBASE_CONFIG ? await firebaseAdapter(FIREBASE_CONFIG) : localAdapter(); }
  catch (e) { DB = localAdapter(); setTimeout(() => toast("Sync is unreachable, working on this phone only"), 500); }
  await DB.init();
  user = DB.user();
  DB.watchProfiles(p => { profiles = p; const me = myUid(); if (DB.mode === "local") Object.keys(p).forEach(watch); else if (me) watch(me); render(); });
  DB.watchSugs(s => { sugs = s; render(); });
  DB.watchFollows?.(f => { follows = f; render(); });
  DB.watchActs?.(a => { acts = a.sort((x, y) => (y.at || "").localeCompare(x.at || "")); if (!["record"].includes(ui.route)) render(); });
  setTimeout(() => { const u = myUid(); if (u && navigator.onLine) fetchNews(u); }, 4000);
  DB.onAuth(u => { const was = user?.uid; user = u; if (was !== u?.uid) { render(); } });
  render();
})();
/* ---------- pull down to update ---------- */
(() => {
  const ind = h("div", { class: "ptr", "aria-hidden": "true" }, h("span", {}, "↻")); document.body.append(ind);
  let y0 = null, dy = 0, busy = false;
  const ready = () => !busy && window.scrollY <= 0 && !document.querySelector(".scrim,.turn,.r3full");
  addEventListener("touchstart", e => { y0 = ready() && e.touches.length === 1 ? e.touches[0].clientY : null; dy = 0; ind.style.transition = "none"; }, { passive: true });
  addEventListener("touchmove", e => { if (y0 == null) return; dy = e.touches[0].clientY - y0; if (dy <= 0 || window.scrollY > 0) { ind.style.transform = "translate(-50%,-70px)"; return; } const d = Math.min(dy * 0.5, 90); ind.style.transform = "translate(-50%," + (d - 60) + "px)"; ind.firstChild.style.transform = "rotate(" + dy * 2 + "deg)"; ind.style.opacity = Math.min(1, dy / 120); }, { passive: true });
  addEventListener("touchend", async () => {
    if (y0 == null) return; y0 = null; ind.style.transition = "transform .2s ease";
    if (dy < 140 || window.scrollY > 0) { ind.style.transform = "translate(-50%,-70px)"; return; }
    busy = true; ind.style.transform = "translate(-50%,24px)"; ind.firstChild.style.transform = ""; ind.classList.add("spin");
    try { const reg = await navigator.serviceWorker?.getRegistration(); await reg?.update(); } catch (e) {}
    setTimeout(() => location.reload(), 300);
  });
})();
if (PREVIEW) document.getElementById("pvbar").hidden = false;
if ("serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "localhost")) navigator.serviceWorker.register("sw.js");
</script>
</body>
